[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "limbform"
version = "0.0.1"
description = "Open-core CAD layer automating transtibial prosthetic socket trim-line generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Arthur Gouaze", email = "122196040+arthurgouaze@users.noreply.github.com" }]
keywords = ["prosthetics", "cad", "mesh", "trim-line", "fitting"]
dependencies = [
    "numpy>=1.26",
    "trimesh>=4.0",
    "scipy>=1.11",
    # rtree provides the spatial index trimesh uses for ray-mesh intersection,
    # which the trim-line rule engine relies on to project the curve onto the
    # surface. The wheel bundles libspatialindex; headless, no GL.
    "rtree>=1.0",
    # trimesh.repair.fix_winding walks the face-adjacency graph with networkx;
    # mesh cleanup uses it to make scan winding consistent before hole filling.
    "networkx>=3.0",
]

[project.optional-dependencies]
# Interactive viewer + point-picking landmark UI. Kept optional: it pulls in the
# heavy GL/VTK stack, which needs a working OpenGL driver and is dead weight for
# headless/CI runs. The core trim-line pipeline (io / landmarks math / trimline /
# cli with --landmarks) runs without it.
viz = ["pyvista>=0.43"]
# Quadric decimation for clean_mesh(max_faces=...) and fit --max-faces. Optional
# because only dense scans on small boards need it.
decimate = ["fast-simplification>=0.1"]
dev = ["pytest>=8.0", "ruff>=0.5", "fast-simplification>=0.1"]

[project.scripts]
limbform = "limbform.cli:main"

[project.urls]
Homepage = "https://github.com/arthurgouaze/limbform"

[tool.hatch.build.targets.wheel]
packages = ["src/limbform"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
