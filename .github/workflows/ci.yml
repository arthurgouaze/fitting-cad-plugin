name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # On ubuntu the manylinux wheels (numpy, trimesh, rtree, ...) and ruff run
      # directly, with no NixOS loader shims. Only the dev extra is installed
      # (pytest, ruff, fast-simplification). The viz extra (pyvista, GL/VTK)
      # stays out to keep CI light and headless; the viewer tests skip
      # themselves when pyvista is absent.
      - name: Install package (dev extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest
